services:
  - type: web
    name: jashn-jewels
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jashn-jewels-db
          property: connectionString

databases:
  - name: jashn-jewels-db
    databaseName: jashn_jewels
    plan: free
